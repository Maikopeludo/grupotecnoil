<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Grupo Tecnoil S.A.S.: filtración de agua de flowback y produced water, reparación de válvulas, orificios calibrados de tungsteno y desarrollos metalmecánicos para la industria petrolera en Argentina.">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Grupo Tecnoil Alternativa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Red+Hat+Mono:wght@400;500&display=swap">
<style>
/* Layout: estructura de sitio corporativo industrial (header fijo con megamenú, slider, grillas de equipos, ficha técnica). Ilustraciones tipo plano técnico. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#0E2236; --muted:#4F5F70; --line:#D5DCE3;
  --navy:#14365A; --red:#1F6FBF; --red-ink:#1C64AD; --steel:#8A98A6;
  --band:#0D1F31; --band-ink:#E8EDF2; --band-muted:#9FB0C1;
  --ill-bg:#E9EEF3; --ill-grid:#D6DEE6; --ill-line:#14365A; --ill-fill:#F7F9FB; --ill-txt:#4F5F70;
  --header:#FFFFFF; --header-ink:#0E2236;
  --ok:#1E7A4C; --ok-bg:#E3F2EA; --warn:#8A5A00; --warn-bg:#FBF0D9; --new:#14365A; --new-bg:#E3EBF4; --no:#6B7480; --no-bg:#ECEEF1;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1724; --surface:#112233; --ink:#E6ECF2; --muted:#A3B2C2; --line:#233A51;
  --navy:#7FA9D6; --red:#3D8BD6; --red-ink:#86BDF0; --steel:#7D8B99;
  --band:#07111B; --band-ink:#E8EDF2; --band-muted:#91A3B5;
  --ill-bg:#0F2133; --ill-grid:#1A3149; --ill-line:#9CC0E6; --ill-fill:#13283D; --ill-txt:#9FB0C1;
  --ok:#6FD39F; --ok-bg:#12321F; --warn:#F0C26A; --warn-bg:#352812; --new:#9CC0E6; --new-bg:#15304A; --no:#A9B2BC; --no-bg:#1D2A37;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1724; --surface:#112233; --ink:#E6ECF2; --muted:#A3B2C2; --line:#233A51;
  --navy:#7FA9D6; --red:#3D8BD6; --red-ink:#86BDF0; --steel:#7D8B99;
  --band:#07111B; --band-ink:#E8EDF2; --band-muted:#91A3B5;
  --ill-bg:#0F2133; --ill-grid:#1A3149; --ill-line:#9CC0E6; --ill-fill:#13283D; --ill-txt:#9FB0C1;
  --ok:#6FD39F; --ok-bg:#12321F; --warn:#F0C26A; --warn-bg:#352812; --new:#9CC0E6; --new-bg:#15304A; --no:#A9B2BC; --no-bg:#1D2A37;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--header)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink);font-weight:500}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* top bar + header */
.topbar{background:var(--band);color:var(--band-muted);font-size:13px}
.topbar .wrap{display:flex;gap:20px;justify-content:space-between;align-items:center;padding-block:7px;flex-wrap:wrap}
.topbar span b{color:var(--band-ink);font-weight:500}
.ph{background:rgba(31,111,191,.18);color:#BFDBF7;padding:0 6px;border-radius:3px;font-family:var(--f-mono);font-size:12px}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--header);color:var(--header-ink);border-bottom:1px solid #D5DCE3;color-scheme:light}
header.site .wrap{display:flex;align-items:center;gap:16px;height:76px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img.gota{height:50px;width:auto}
.brand img.texto{height:22px;width:auto}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:#4F5F70;text-transform:uppercase;margin-top:3px}
nav.main{display:flex;align-items:stretch;gap:2px;margin-left:auto;height:100%}
nav.main>.item{position:relative;display:flex;align-items:center}
nav.main>.item>a{display:flex;align-items:center;gap:5px;height:100%;padding:0 9px;text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:#0E2236;border-bottom:3px solid transparent;white-space:nowrap}
nav.main>.item>a:hover,nav.main>.item>a.on{border-bottom-color:#1F6FBF}
nav.main>.item>a .car{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.6}
.mega{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#FFFFFF;border:1px solid #D5DCE3;border-top:3px solid #1F6FBF;box-shadow:0 18px 40px rgba(14,34,54,.16);padding:22px;display:none;gap:28px;min-width:260px}
.item:hover>.mega,.item:focus-within>.mega{display:flex}
.mega .col{min-width:220px}
.mega h5{margin:0 0 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#1F6FBF;font-weight:500}
.mega a{display:block;padding:6px 0;text-decoration:none;font-size:14.5px;color:#0E2236;border-bottom:1px solid #EEF1F4}
.mega a:hover{color:#1F6FBF}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:12px 20px;border:2px solid transparent;cursor:pointer;line-height:1;border-radius:2px}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{filter:brightness(1.08)}
.btn-ghost{border-color:currentColor;color:inherit;background:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
header .btn-red{background:#1F6FBF;padding:11px 16px;font-size:16px;flex-shrink:0}
.burger{display:none;margin-left:auto;background:none;border:1px solid #D5DCE3;width:44px;height:44px;cursor:pointer;color:#0E2236;border-radius:2px}
.burger span{display:block;width:20px;height:2px;background:currentColor;margin:4px auto}
.mnav{display:none}

@media (max-width:1380px){nav.main>.item:first-child{display:none}nav.main>.item>a{padding:0 6px;font-size:15px}.brand small{display:none}}
@media (max-width:1440px){header .btn-red{display:none}}
@media (max-width:1180px){
  nav.main,header .btn-red{display:none}
  .burger{display:block}
  .mnav{background:#FFFFFF;color:#0E2236;border-bottom:1px solid #D5DCE3;color-scheme:light}
  .mnav.open{display:block}
  .mnav .wrap{padding-block:8px 16px}
  .mnav details{border-bottom:1px solid #EEF1F4}
  .mnav summary,.mnav>.wrap>a{display:block;padding:12px 0;font-family:var(--f-display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.03em;text-decoration:none;cursor:pointer;list-style:none;border-bottom:1px solid #EEF1F4}
  .mnav details summary{border-bottom:0}
  .mnav details a{display:block;padding:7px 0 7px 12px;text-decoration:none;font-size:15px}
  .mnav h5{margin:8px 0 2px 12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:#1F6FBF;text-transform:uppercase;font-weight:500}
  .mnav .btn{margin-top:14px;width:100%;justify-content:center;background:#1F6FBF;color:#fff}
}

/* illustrations */
.ill{background-color:var(--ill-bg);position:relative;overflow:hidden}
.prod .ill{background-image:linear-gradient(var(--ill-grid) 1px,transparent 1px),linear-gradient(90deg,var(--ill-grid) 1px,transparent 1px);background-size:20px 20px}
.card .ill .t,.card .ill .a{display:none}
.photo{background:#FFFFFF;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:400/260;max-width:100%}
.photo img{height:100%;width:100%;object-fit:cover;padding:0}
.photo.contain img{object-fit:contain;padding:10px}
.photo.cover img{object-fit:cover;padding:0}
.photo .tag{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(13,31,49,.78);color:#E8EDF2;padding:2px 6px}
.ill svg{display:block;width:100%;height:100%}
.ill .l{fill:none;stroke:var(--ill-line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ill .f{fill:var(--ill-fill)}
.ill .s{fill:var(--ill-line);opacity:.14}
.ill .d{stroke-dasharray:5 4;stroke-width:1.4}
.ill .a{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ill .t{fill:var(--ill-txt);font-family:var(--f-mono);font-size:10px;letter-spacing:.08em}
.ill .g{stroke:var(--ill-line);stroke-width:1;opacity:.5}
.ill .tag{position:absolute;left:12px;bottom:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ill-txt);text-transform:uppercase}

/* hero slider */
.hero{background:var(--band);color:var(--band-ink);position:relative}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding-block:48px 56px;min-height:440px}
.slide{display:none}
.slide.on{display:contents}
.slide .txt{display:flex;flex-direction:column;gap:18px;min-width:0}
.slide .eyebrow{color:#8EC3F2}
.slide h2{font-size:clamp(38px,5.2vw,64px);text-transform:uppercase;color:#fff}
.slide p{color:var(--band-muted);font-size:17px;max-width:52ch}
.slide .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.slide .ctas .btn-red{background:#1F6FBF}
.slide .ill{aspect-ratio:400/260;max-width:100%;--ill-bg:#102A42;--ill-grid:#173755;--ill-line:#A9C7E6;--ill-fill:#123049;--ill-txt:#8FA7BF;border:1px solid #1E3C59}
.slide .ill .tag{display:none}
.dots{position:absolute;left:0;right:0;bottom:18px}
.dots .wrap{display:flex;gap:8px;min-height:0;padding-block:0;grid-template-columns:none}
.dots button{width:34px;height:4px;border:0;background:#33506C;cursor:pointer;padding:0}
.dots button.on{background:#3D8BD6}
.dots button span{position:absolute;left:-9999px}

/* sections */
section.blk{padding-block:72px}
section.blk.alt{background:var(--surface);border-block:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.sh .l1{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.sh h2{font-size:clamp(32px,4vw,46px);text-transform:uppercase}
.sh p{color:var(--muted)}
.more{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--red-ink);text-decoration:none;white-space:nowrap}
.more:hover{text-decoration:underline}

.intro .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:start}
.intro h1{font-size:clamp(30px,3.6vw,44px);text-transform:uppercase}
.intro p{color:var(--muted);margin-top:16px;max-width:62ch}
.quick{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.quick a{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.quick a:hover{color:var(--red-ink)}
.quick a::after{content:"→";color:var(--red-ink);font-family:var(--f-body)}

.stats{background:var(--navy);color:#fff}
:root .stats{background:#14365A}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding-block:30px}
.stat{padding:6px 22px;border-left:1px solid rgba(255,255,255,.18)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font-family:var(--f-display);font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{display:block;color:#C3D3E3;font-size:14px;margin-top:6px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;text-decoration:none;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--navy);transform:translateY(-2px)}
.card .ill,.card .photo{aspect-ratio:400/260;max-width:100%;border-bottom:1px solid var(--line)}
.card .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:23px;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px}
.card h3::after{content:"→";font-family:var(--f-body);font-size:18px;color:var(--red-ink);opacity:0;transform:translateX(-6px);transition:opacity .15s,transform .15s}
.card:hover h3::after{opacity:1;transform:none}
.card p{color:var(--muted);font-size:14.5px}
.card .go{margin-top:auto;padding-top:10px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--red-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:2px;align-self:flex-start;font-weight:500}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-compatible{color:var(--ok);background:var(--ok-bg)}
.c-parcial{color:var(--warn);background:var(--warn-bg)}
.c-nuevo{color:var(--new);background:var(--new-bg)}
.c-no{color:var(--no);background:var(--no-bg)}
.c-propio{color:var(--red-ink);background:rgba(31,111,191,.1)}

.sectors{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sector{padding:26px 24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.sector:hover{background:var(--bg)}
.sector .eyebrow{color:var(--muted)}
.sector h3{font-size:26px;text-transform:uppercase}
.sector p{color:var(--muted);font-size:14.5px}
.sector .go{margin-top:6px;color:var(--red-ink);font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

.clients{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.client{background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 12px;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-height:84px;overflow-wrap:anywhere;min-width:0}

.contact-band{background:var(--band);color:var(--band-ink)}
.contact-band .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding-block:64px;align-items:center}
.contact-band h2{font-size:clamp(32px,4vw,46px);text-transform:uppercase;color:#fff}
.contact-band p{color:var(--band-muted);margin-top:12px;max-width:56ch}
.contact-band .btn{margin-top:22px;background:#1F6FBF;color:#fff}
.cinfo{display:flex;flex-direction:column;gap:14px;border-left:1px solid #22405C;padding-left:28px}
.cinfo div{display:flex;flex-direction:column}
.cinfo small{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8EC3F2}
.cinfo span{font-size:17px}

footer.site{background:var(--band);color:var(--band-muted);border-top:1px solid #1B3350;font-size:14px}
footer .top{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:32px;padding-block:52px 36px}
footer h6{margin:0 0 12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#E8EDF2;font-weight:500}
footer a{display:block;text-decoration:none;padding:3px 0;color:var(--band-muted)}
footer a:hover{color:#fff}
.fbrand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fbrand img{height:52px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.06em;color:#E8EDF2;line-height:1}
.wordmark em{font-style:normal;color:#E0475C}
footer .bottom{border-top:1px solid #1B3350;padding-block:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px}

/* inner pages */
.crumbs{font-size:13px;color:var(--muted);padding-block:16px;font-family:var(--f-mono)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--red-ink)}
.crumbs i{font-style:normal;margin:0 8px;opacity:.5}
.phero{background:var(--band);color:var(--band-ink)}
.phero .wrap{padding-block:46px 50px;display:flex;flex-direction:column;gap:14px}
.phero .eyebrow{color:#8EC3F2}
.phero h1{font-size:clamp(36px,5vw,60px);text-transform:uppercase;color:#fff;max-width:22ch}
.phero p{color:var(--band-muted);max-width:66ch;font-size:17px}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
.prod .ill,.prod .photo{aspect-ratio:400/260;max-width:100%;border:1px solid var(--line)}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumbs button{flex:1;padding:0;border:1px solid var(--line);background:none;cursor:pointer;min-width:0}
.thumbs button.on{outline:2px solid var(--red);outline-offset:-2px}
.thumbs .ill,.thumbs .photo{aspect-ratio:400/260;border:0;pointer-events:none}
.thumbs .ill .t,.thumbs .photo .tag,.thumbs .ill .tag{display:none}
.spot{display:grid;grid-template-columns:1.25fr 1fr;background:var(--surface);border:1px solid var(--line)}
.spot .photo{aspect-ratio:auto;height:100%;min-height:340px}
.spot .photo img{object-position:100% 50%}
.spot .txt{padding:40px 40px;display:flex;flex-direction:column;gap:14px;min-width:0}
.spot h2{font-size:clamp(30px,3.6vw,42px);text-transform:uppercase}
.spot p{color:var(--muted)}
.spot ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.spot li{padding-left:18px;position:relative}
.spot li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:2px;background:var(--red)}
.spot .btn{align-self:flex-start;margin-top:8px}
.mk{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.mk a{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:26px 28px;text-decoration:none;min-width:0}
.mk a:hover{border-color:var(--red)}
.mk .wm{grid-row:span 2;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.04em;color:var(--ink);border-right:1px solid var(--line);padding-right:22px;line-height:1}
.mk .wm small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:400;margin-top:6px}
.mk b{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink);font-weight:500}
.mk p{color:var(--muted);font-size:14.5px}
.badge{display:inline-flex;align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid #8EC3F2;color:#BFDBF7;padding:5px 10px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--surface)}
.facts div{padding:20px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.facts div:last-child{border-right:0}
.facts b{font-family:var(--f-display);font-size:20px;text-transform:uppercase}
.facts span{color:var(--muted);font-size:14.5px}

/* ---- calculadora skid móvil ---- */
const FLUIDOS={agua:['Agua dulce de captación',1],produced:['Produced water',0.6],flowback:['Flowback con sólidos',0.45]};
const MICRONES=[[1,0.35],[5,0.55],[10,0.7],[25,0.85],[50,1],[100,1.15]];
const DN=[80,100,150,200,250,300];
function skidCalc(){return `<div class="sel calc"><div class="sel-h"><div><span class="eyebrow">Configurador</span><h3>Dimensioná tu unidad móvil</h3></div></div>
 <div class="calc-in">
  <label>Caudal<span><input id="cq" type="number" min="5" max="600" step="5" value="120" inputmode="numeric"> m³/h</span></label>
  <label>Fluido<select id="cf">${Object.entries(FLUIDOS).map(([k,v])=>`<option value="${k}"${k==='flowback'?' selected':''}>${v[0]}</option>`).join('')}</select></label>
  <label>Grado de filtración<select id="cm">${MICRONES.map(([m])=>`<option value="${m}"${m===25?' selected':''}>${m} µm</option>`).join('')}</select></label>
  <label class="chk"><input id="cr" type="checkbox" checked> Recipiente en espera para cambio de bolsas</label>
 </div>
 <div class="sel-body"><div class="sel-spec" id="cout"></div><div class="sel-plano"><div class="calc-svg" id="csvg"></div><p>Esquema a escala relativa. Se actualiza con el caudal.</p></div></div>
 <p class="calc-note">Estimación preliminar con bolsas tamaño #2 y recipientes multibolsa de 8 bolsas. El diseño final depende del análisis de agua.</p></div>`}
function calcRun(){
 const q=Math.max(1,+document.getElementById('cq').value||0),f=FLUIDOS[document.getElementById('cf').value][1],
  mu=+document.getElementById('cm').value,mf=MICRONES.find(x=>x[0]===mu)[1],red=document.getElementById('cr').checked;
 const perBag=20*f*mf, bags=Math.ceil(q/perBag), vessels=Math.ceil(bags/8), total=vessels+(red?1:0);
 const units=Math.ceil(total/6), perUnit=Math.ceil(total/units);
 const len=perUnit<=2?6:perUnit<=4?9:12, axles=perUnit<=2?1:perUnit<=4?2:3;
 const v=2.5, dmm=Math.sqrt(4*(q/units)/3600/(Math.PI*v))*1000, dn=DN.find(x=>x>=dmm)||300;
 document.getElementById('cout').innerHTML=`<div class="sel-model"><b>${total} recipientes</b><span>${units>1?units+' unidades':'1 unidad'}</span></div>
 <dl><dt>Caudal por bolsa</dt><dd>${perBag.toFixed(1)} m³/h</dd><dt>Bolsas en servicio</dt><dd>${bags}</dd>
 <dt>Recipientes de 8 bolsas</dt><dd>${vessels}${red?' + 1 en espera':''}</dd><dt>Unidades móviles</dt><dd>${units} × ${perUnit} recipientes</dd>
 <dt>Largo de acoplado</dt><dd>${len} m</dd><dt>Ejes</dt><dd>${axles===1?'Simple':axles===2?'Tándem':'Triple'}</dd>
 <dt>Colector sugerido</dt><dd>DN${dn}</dd></dl>`;
 // svg
 const Wd=60+len*42, H=150, n=perUnit, x0=24;
 const VW=60+12*42+40; let s=`<svg viewBox="0 0 ${VW} ${H+20}" role="img" aria-label="Esquema de la unidad móvil">`;
 s+=`<line class="g" x1="0" y1="${H}" x2="${VW}" y2="${H}"/>`;
 s+=`<rect class="f l" x="${x0}" y="104" width="${Wd-x0}" height="12" rx="2"/><line class="l" x1="${x0}" y1="110" x2="4" y2="122"/>`;
 const vw=Math.min(40,(Wd-x0-70)/n-10);
 for(let i=0;i<n;i++){const vx=x0+20+i*(vw+10);s+=`<rect class="f l" x="${vx}" y="44" width="${vw}" height="60" rx="8"/><rect class="f l" x="${vx+4}" y="36" width="${vw-8}" height="9" rx="2"/>${(red&&i===n-1&&units===1)?`<rect class="s" x="${vx}" y="44" width="${vw}" height="60" rx="8"/>`:''}`}
 const mx=x0+20, mw=n*(vw+10)-10; s+=`<rect class="f l" x="${mx-6}" y="88" width="${mw+12}" height="9" rx="4"/>`;
 const bx=x0+20+n*(vw+10); if(bx+34<Wd) s+=`<rect class="f l" x="${bx}" y="70" width="34" height="34" rx="3"/>`;
 const ax=Wd-40; for(let a=0;a<axles;a++){const cx=ax-a*30;s+=`<circle class="f l" cx="${cx}" cy="128" r="12"/><circle class="s" cx="${cx}" cy="128" r="5"/>`}
 s+=`<line class="l d" x1="${x0}" y1="${H+12}" x2="${Wd}" y2="${H+12}"/><text class="t" x="${(x0+Wd)/2}" y="${H+9}" text-anchor="middle">${len} m</text></svg>`;
 document.getElementById('csvg').innerHTML=s}

function d3Calc(){
 const nb=CFG.bolsas*CFG.bpv, stages=[];
 if(CFG.mag) stages.push(['Separador magnético',150]);

function bagCalc(){const s=BAGS[BB.size],f=MIC.find(m=>m[0]===BB.mic)[1],qb=s.q*f;

 return {s,f,qb,bph,n,nTot,bags,q,area,dn}}
function bagSVG(c){
 const PER=6,n=c.nTot,nRows=Math.ceil(n/PER),perRow=Math.ceil(n/nRows),gap=92,vw=58,RH=300,W=Math.max(560,140+perRow*gap);

 for(let r=0;r<nRows;r++){
  const cnt=Math.min(perRow,n-idx),oy=r*RH,x0=W/2-((perRow-1)*gap)/2,yT=70+oy,yB=210+oy,H=RH;
  const xa=x0-60,xb=x0+(cnt-1)*gap+60;
  if(nRows>1)s+=`<text class="t" x="8" y="${oy+16}">LÍNEA ${r+1}</text>`;
  s+=`<line class="g" x1="0" y1="${oy+H-14}" x2="${W}" y2="${oy+H-14}"/>`;
  s+=`<rect class="f l" x="${xa}" y="${yB+28}" width="${xb-xa}" height="14" rx="7"/><rect class="f l" x="${xa}" y="${yT-26}" width="${xb-xa}" height="14" rx="7"/>`;
  s+=`<path class="a" d="M${xa-34} ${yT-19} L${xa-4} ${yT-19} M${xa-12} ${yT-25} L${xa-4} ${yT-19} L${xa-12} ${yT-13}"/><text class="t" x="${xa-34}" y="${yT-32}">ENTRADA</text>`;
  s+=`<path class="a ao" d="M${xb+4} ${yB+35} L${xb+34} ${yB+35} M${xb+26} ${yB+29} L${xb+34} ${yB+35} L${xb+26} ${yB+41}"/><text class="t" x="${xb+34}" y="${yB+58}" text-anchor="end">SALIDA</text>`;
  for(let i=0;i<cnt;i++,idx++){const x=x0+i*gap,sp=c.nTot>c.n&&idx===n-1;
   s+=`<line class="l" x1="${x}" y1="${yB+28}" x2="${x}" y2="${yB+6}"/><line class="l" x1="${x}" y1="${yT-12}" x2="${x}" y2="${yT}"/>`;
   s+=`<path class="a" d="M${x-4} ${yT-8} L${x} ${yT-1} L${x+4} ${yT-8}"/><path class="a ao" d="M${x-4} ${yB+14} L${x} ${yB+21} L${x+4} ${yB+14}"/>`;
   s+=`<rect class="${sp?'s2':'f'} l" x="${x-vw/2}" y="${yT}" width="${vw}" height="${yB-yT}" rx="12"/>`;
   s+=`<rect class="f l" x="${x-vw/2-4}" y="${yT-6}" width="${vw+8}" height="10" rx="3"/>`;
   const k=c.bph,cols=k<=2?k:k<=4?2:k<=6?3:4,rows=Math.ceil(k/cols),cw=(vw-12)/cols,ch=Math.min(cw,(yB-yT-40)/Math.max(rows,1));
   for(let j=0;j<k;j++){const cx=x-vw/2+6+cw*(j%cols)+cw/2,cy=yT+18+ch*Math.floor(j/cols)+ch/2;s+=`<circle class="bagc" cx="${cx}" cy="${cy}" r="${Math.min(cw,ch)/2-2}"/>`}
   s+=`<line class="l" x1="${x-vw/2+8}" y1="${yB}" x2="${x-vw/2+4}" y2="${oy+H-14}"/><line class="l" x1="${x+vw/2-8}" y1="${yB}" x2="${x+vw/2-4}" y2="${oy+H-14}"/>`;
   s+=`<text class="t" x="${x}" y="${oy+H-20}" text-anchor="middle">${sp?'RESERVA':'R'+(idx+1)}</text>`}}
 return s+'</svg>'}

 <div class="tree"><div><h4>Filtros → Filtración</h4><ul>${of('filtros').map(p=>`<li>${p.name}</li>`).join('')}</ul></div><div><h4>Sistemas → Filtración</h4><ul>${of('sistemas').map(p=>`<li>${p.name}</li>`).join('')}</ul></div><div><h4>Nuevos menús</h4><ul><li>Válvulas (${of('valvulas').length})</li><li>Oil & Gas · Antares (${of('oilgas').length})</li><li>Desarrollos (${of('desarrollos').length})</li></ul></div><div><h4>Industrias → Aplicaciones</h4><ul>${APPS.map(a=>`<li>${a.name}</li>`).join('')}</ul></div></div>
 <div class="sh" style="margin-top:56px"><div class="l1"><span class="eyebrow">Compatibilidad</span><h2>Web de referencia vs. presentación a Tecpetrol</h2></div></div>
 <div class="tbl"><table><thead><tr><th>Equipo en web de referencia</th><th>Línea en presentación TECNOIL</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="chip c-${r[2]}">${STATUS[r[2]]}</span></td></tr>`).join('')}</tbody></table></div></div></section>`}

/* ---------- router ---------- */
const app=document.getElementById('app');
function route(){const h=(location.hash||'#inicio').slice(1)||'inicio';let html;
 clearInterval(timer); d3Dispose(); bg3Dispose();
 if(h==='inicio')html=home();
 else if(['filtracion','valvulas','oil-gas','desarrollos'].includes(h))html=catPage(h);
 else if(h==='aplicaciones')html=appsPage();
 else if(h==='nosotros')html=aboutPage();
 else if(h==='contacto')html=contactPage();
 else if(h==='estructura')html=structPage();
 else if(MARCAS[h])html=brandPage(h);
 else if(h==='disenador')html=designPage();
 else if(h==='espectro')html=specPage();
 else if(BY[h])html=prodPage(BY[h]);
 else html=home();
 app.innerHTML=html;
 const top=BY[h]?CATS[BY[h].cat].page:((MARCAS[h]||h==='disenador'||h==='espectro')?'filtracion':h);
 document.querySelectorAll('nav.main>.item>a').forEach(a=>a.classList.toggle('on',a.dataset.h===top));
 mnav.classList.remove('open');burger.setAttribute('aria-expanded','false');
 if(h==='inicio'||!h)startSlider();
 document.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>{const p=BY[h];document.getElementById('pm').innerHTML=media(p.media[+b.dataset.m]);document.querySelectorAll('.thumbs button').forEach(x=>x.classList.toggle('on',x===b))});
 if(BY[h]&&BY[h].sel){document.querySelectorAll('.sel-chips button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;document.getElementById('dafq').value=DAF[i][1];dafSpec(i)});const q=document.getElementById('dafq');q.oninput=()=>dafPick(+q.value);dafPick(+q.value)}
 if(BY[h]&&BY[h].bag)bagWire();
 if(document.getElementById('spc'))specWire();
 if(BY[h]&&BY[h].calc){['cq','cf','cm','cr'].forEach(id=>{const e=document.getElementById(id);e.oninput=calcRun;e.onchange=calcRun});calcRun()}
 if(h==='disenador')d3Wire();
 const f=document.getElementById('qf');
 if(f&&window.__cfgText){document.getElementById('f-msg').value=window.__cfgText;window.__cfgText=''}
 if(f)f.addEventListener('submit',e=>{e.preventDefault();const ok=document.getElementById('qok');
  const n=document.getElementById('f-nom').value.trim(),m=document.getElementById('f-mail').value.trim();
  if(!n||!m.includes('@')){ok.hidden=false;ok.style.background='var(--warn-bg)';ok.style.color='var(--warn)';ok.textContent='Complete nombre y un email válido para enviar la consulta.';return}
  ok.hidden=false;ok.style.background='';ok.style.color='';const eq=document.getElementById('f-eq').value;const dest=/Desarrollo|tungsteno/i.test(eq)?'ingenieria@tecnoil-nqn.com':'ventas@tecnoil-nqn.com';ok.textContent='Vista previa del formulario. En el sitio publicado, esta consulta llegará a '+dest+'.'});
 window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script>
